name: trans
description: Transaction ledger tracking debits, credits, operations, and running balances.
primary_keys:
  - trans_id
domain_notes: >
  High volume fact table. Each transaction modifies the account running balance.
  Types and operations use Czech banking acronyms.
columns:
  - name: trans_id
    type: INTEGER
    primary_key: true
    description: Unique transaction identifier.
    sample_values: [1, 2, 3, 1000]
  - name: account_id
    type: INTEGER
    description: Associated bank account ID.
    foreign_key: account.account_id
    sample_values: [1, 2, 3]
  - name: date
    type: TEXT
    description: Date of transaction execution (YYYY-MM-DD).
    sample_values: ['1995-03-24', '1995-04-13', '1996-01-02']
  - name: type
    type: TEXT
    description: Transaction flow direction.
    business_meaning: >
      'PRIJEM' = Inflow / credit / deposit,
      'VYDAJ' = Outflow / debit / withdrawal.
    sample_values: ['PRIJEM', 'VYDAJ']
  - name: operation
    type: TEXT
    description: Method or mechanism of transaction execution.
    business_meaning: >
      'VKLAD' = Cash deposit,
      'PREVOD Z UCTU' = Collection from another bank account,
      'VYBER' = Cash withdrawal,
      'PREVOD NA UCET' = Remittance to another bank account,
      'VYBER KARTOU' = Credit card withdrawal.
    sample_values: ['VKLAD', 'PREVOD Z UCTU', 'VYBER', 'PREVOD NA UCET', 'VYBER KARTOU']
  - name: amount
    type: REAL
    description: Transaction monetary amount.
    sample_values: [1000.0, 3679.0, 1100.0, 500.0]
  - name: balance
    type: REAL
    description: Account running balance immediately following transaction execution.
    sample_values: [1000.0, 4679.0, 3500.0, 12050.0]
