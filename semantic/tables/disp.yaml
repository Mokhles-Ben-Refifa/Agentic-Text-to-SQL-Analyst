name: disp
description: Disposition table establishing access privileges between clients and accounts.
primary_keys:
  - disp_id
domain_notes: >
  Essential join bridge between client and account, and between disp and card.
  'OWNER' is the primary account owner; 'DISPONENT' is an authorized signatory user.
  CRITICAL: To avoid double-counting traps when joining clients to accounts or loans,
  ALWAYS filter `disp.type = 'OWNER'` or use `DISTINCT client_id`, because accounts with a disponent
  have multiple records in this table.
columns:
  - name: disp_id
    type: INTEGER
    primary_key: true
    description: Unique disposition record identifier.
    sample_values: [1, 2, 3, 200]
  - name: client_id
    type: INTEGER
    description: ID of client who holds privileges on the account.
    foreign_key: client.client_id
    sample_values: [1, 2, 3]
  - name: account_id
    type: INTEGER
    description: Bank account ID.
    foreign_key: account.account_id
    sample_values: [1, 2, 3]
  - name: type
    type: TEXT
    description: Disposition relationship type.
    business_meaning: >
      'OWNER' = Primary account owner with full legal rights,
      'DISPONENT' = Secondary authorized user with transaction privileges.
    sample_values: ['OWNER', 'DISPONENT']
