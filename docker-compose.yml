services:
  postgres:
    image: postgres:16-alpine
    container_name: sql_agent_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-admin_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-insurance_warehouse}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data/init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER:-admin} -d ${POSTGRES_DB:-insurance_warehouse}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
