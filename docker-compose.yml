services:
  postgres:
    image: postgres:16-alpine
    container_name: sql_agent_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-admin_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-bird_warehouse}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data/init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER:-admin} -d ${POSTGRES_DB:-bird_warehouse}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sql_agent_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8000:8000"
    command: ["uv", "run", "uvicorn", "app.api:app", "--host", "0.0.0.0", "--port", "8000"]

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sql_agent_ui
    restart: unless-stopped
    depends_on:
      - api
    env_file:
      - .env
    ports:
      - "8501:8501"
    command: ["uv", "run", "streamlit", "run", "app/ui.py", "--server.headless=true", "--server.port=8501", "--server.address=0.0.0.0"]

volumes:
  postgres_data:
