[project]
name = "sql-agent"
version = "0.1.0"
description = "Agentic Text-to-SQL Analyst with LangGraph, FastMCP, and PostgreSQL"
readme = "Project_overview.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chromadb>=0.5.0",
    "faker>=25.0.0",
    "fastapi>=0.111.0",
    "fastmcp>=0.1.0",
    "langchain-anthropic>=0.2.0",
    "langchain-community>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langfuse>=2.36.0",
    "langgraph>=0.2.0",
    "mcp>=1.0.0",
    "pandas>=2.2.0",
    "plotly>=5.22.0",
    "psycopg[binary]>=3.1.0",
    "psycopg-pool>=3.2.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.1",
    "rank-bm25>=0.2.2",
    "sqlalchemy>=2.0.0",
    "sqlglot>=25.0.0",
    "streamlit>=1.35.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.7.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
